<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>폰프리 사용량 조사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{
  --bg:#f4f6f3; --card:#ffffff; --ink:#1d2420; --sub:#5d6862; --line:#dfe4e0;
  --pri:#1f7a53; --pri-soft:#e3f2ea; --warn:#b4541f; --warn-soft:#fbeee5; --done:#8a958f;
  --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;-webkit-text-size-adjust:100%}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 60px}
.wrap.wide{max-width:1040px}
h1{font-size:22px;font-weight:900;margin:4px 0 2px;letter-spacing:-.02em}
h2{font-size:16px;font-weight:700;margin:0 0 12px}
.sub{color:var(--sub);font-size:14px;line-height:1.55}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--pri-soft);color:var(--pri)}
.badge.warn{background:var(--warn-soft);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px}
.step{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.step b{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font-size:13px}
.step span{font-weight:700}
.nums{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.nums button{aspect-ratio:1;border:1px solid var(--line);background:#fff;border-radius:10px;font:inherit;font-weight:700;font-size:15px;color:var(--ink);cursor:pointer;position:relative}
.nums button.done{color:var(--done);background:#f1f3f2}
.nums button.done::after{content:"✓";position:absolute;top:1px;right:4px;font-size:10px;color:var(--pri)}
.nums button.sel{background:var(--pri);border-color:var(--pri);color:#fff}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg button{padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;font:inherit;font-weight:700;cursor:pointer;color:var(--ink)}
.seg button.sel{border-color:var(--pri);background:var(--pri-soft);color:var(--pri)}
.howto{margin-top:12px;background:#f7f9f8;border-radius:12px;padding:12px 14px;font-size:13.5px;line-height:1.7;color:var(--sub)}
.howto b{color:var(--ink)}
.drop{display:block;border:2px dashed var(--line);border-radius:14px;padding:26px 12px;text-align:center;cursor:pointer;color:var(--sub);font-size:14px;background:#fafbfa}
.drop strong{display:block;color:var(--pri);font-size:16px;margin-bottom:4px}
.drop input{display:none}
.preview{display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.preview img{width:90px;border-radius:10px;border:1px solid var(--line)}
.progress{height:8px;background:#eef1ef;border-radius:99px;overflow:hidden;margin-top:8px}
.progress i{display:block;height:100%;width:0;background:var(--pri);transition:width .2s}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chips button{border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 12px;font:inherit;font-size:14px;cursor:pointer;color:var(--ink)}
.chips button.sel{border-color:var(--pri);background:var(--pri);color:#fff}
.result{display:flex;gap:14px;align-items:center;margin-top:12px;background:var(--pri-soft);border-radius:14px;padding:12px}
.result img{width:80px;border-radius:10px;border:1px solid var(--line)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;padding:16px;z-index:50}
.modal .box{background:#fff;border-radius:16px;padding:14px;max-width:min(520px,100%);max-height:92vh;overflow:auto;text-align:center}
.modal img{max-width:100%;border-radius:10px;display:block;margin:8px auto 0}
.flag{display:inline-block;font-size:11.5px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--warn-soft);color:var(--warn)}
.btn{display:block;width:100%;padding:15px;border:0;border-radius:14px;background:var(--pri);color:#fff;font:inherit;font-weight:700;font-size:16px;cursor:pointer;margin-top:16px}
.btn:disabled{background:#b9c4be;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}
.btn.sm{display:inline-block;width:auto;padding:8px 14px;font-size:14px;margin:0;border-radius:10px}
.note{font-size:12.5px;color:var(--sub);margin-top:10px;line-height:1.6}
.err{background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:12px;line-height:1.6}
.big{font-size:44px;font-weight:900;letter-spacing:-.03em;margin:8px 0}
.center{text-align:center}
.demo{background:#fff6d8;color:#7a5a00;font-size:13px;padding:8px 12px;border-radius:10px;margin-bottom:10px}
.hidden{display:none!important}
/* admin */
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{color:var(--sub);font-size:12.5px}
.stat div{font-size:24px;font-weight:900;margin-top:4px}
select,.inp{padding:9px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:#fff;color:var(--ink)}
.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:560px}
th,td{padding:10px 8px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12.5px;color:var(--sub);font-weight:500}
td.l,th.l{text-align:left}
.bar{height:10px;background:var(--pri);border-radius:99px;min-width:2px}
.bar.b{background:#9cc9b2}
.down{color:var(--pri);font-weight:700}
.up{color:var(--warn);font-weight:700}
.links td{font-size:13px}
.links code{background:#f2f4f3;padding:2px 6px;border-radius:6px;font-size:12px;word-break:break-all}
.qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px}
.qrbox{border:1px solid var(--line);border-radius:14px;padding:14px;text-align:center;background:#fff}
.qrbox .q{display:flex;justify-content:center;margin:8px 0}
.qrbox b{font-size:20px}
@media print{
  body{background:#fff}
  .noprint{display:none!important}
  .qrbox{break-inside:avoid}
}
</style>
</head>
<body>
<div id="app" class="wrap"></div>

<script>
/* ================== 설정 ================== */
const CONFIG = {
  // Apps Script 웹 앱 URL. 비워두면 데모 모드(저장 안 됨)로 동작합니다.
  API_URL: '',
  TITLE: '폰프리 사용량 조사',
  GRADE: '1학년',
  // 학생에게 보여줄 측정 기준
  METRIC: '이번 주 일일 평균 사용 시간',
  HOWTO: {
    ios: '<b>설정</b> → <b>스크린 타임</b> 화면에서<br><b>‘일일 평균’</b> 글자와 시간이 함께 보이게 캡처하세요.',
    android: '<b>설정</b> → <b>디지털 웰빙 및 자녀 보호</b> → 화면 시간 그래프 → <b>주간</b> 보기<br><b>‘일일 평균’</b> 글자와 시간이 함께 보이게 캡처하세요. (기종마다 메뉴 이름이 조금 달라요)'
  }
};
/* ========================================= */

const $ = s => document.querySelector(s);
const app = $('#app');
const params = new URLSearchParams(location.search);
const DEMO = !CONFIG.API_URL;
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const fmt = m => { if (m == null || isNaN(m)) return '-'; m = Math.round(m); const h = Math.floor(m/60), mm = m%60; return h ? `${h}시간 ${mm}분` : `${mm}분`; };

/* ---------- 캡처 글자에서 '일일 평균'·'총 스크린 타임' 찾기 ---------- */
const TIME_RE = /(\d{1,3})\s*(?:시간|hours?|hrs?|h)\s*(?:(\d{1,2})\s*(?:분|minutes?|mins?|m)(?![a-z]))?|(\d{1,3})\s*(?:분|minutes?|mins?|m)(?![a-z])/i;
function normalizeText(raw){
  return String(raw)
    .replace(/[ \t]+/g, ' ')                                 // 긴 공백 줄이기
    .replace(/([가-힣]) (?=[가-힣])/g, '$1')                  // "시 간" → "시간"
    .replace(/[Oo](?=\s*(시간|분|h|m))/g, '0')
    .replace(/(\d) (\d)(?=\s*(시간|분))/g, '$1$2');
}
// 키워드 바로 뒤(maxGap 글자 안)의 시간. 분이 깨져 읽힌 듯하면(예: "3시간 3332") 불확실로 표시
function timeAfter(text, kwRe, maxGap){
  const re = new RegExp(kwRe.source, 'gi'); let m;
  while ((m = re.exec(text))){
    const start = m.index + m[0].length;
    const seg = text.slice(start, start + maxGap + 20);
    const t = TIME_RE.exec(seg);
    if (t && t.index <= maxGap){
      const min = t[1] != null ? Number(t[1])*60 + (t[2] ? Number(t[2]) : 0) : Number(t[3]);
      const after = seg.slice(t.index + t[0].length);
      const unsure = (t[1] != null && !t[2] && /^\s*\d/.test(after)) || /^[0-9A-Za-z]/.test(after);
      if (min > 0) return { min, unsure };
    }
  }
  return null;
}
function extractUsage(raw){
  const text = normalizeText(raw);
  // 1순위: '일일 평균'·'하루 평균'·'Daily Average' 바로 뒤 / 2순위: '평균' 바로 뒤(가까울 때만)
  let d = timeAfter(text, /(?:일일|하루|일)평[균군귬]|daily\s*average/, 15);
  if (!d) d = timeAfter(text, /평[균군귬]/, 10);
  const t = timeAfter(text, /총(?:스크린|화면|사용)?(?:타임|시간)|total\s*screen\s*time/, 15);
  const daily = d && d.min <= 1440 ? d.min : null, total = t ? t.min : null;
  // 일일 평균은 주간 총 시간보다 클 수 없음
  const unsure = !d || d.unsure || (total != null && daily != null && daily > total);
  return { daily, total, unsure };
}

/* ---------- 이미지 전처리 + OCR ---------- */
function loadImage(file){
  return new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = URL.createObjectURL(file); });
}
// targetW: 글자가 너무 크면 OCR이 '분'을 숫자로 잘못 읽어서, 폭을 줄여서 읽음
function prepImage(img, targetW, thresh){
  const scale = targetW / img.width;
  const W = Math.round(targetW), H = Math.round(Math.min(img.height*scale, W*2.6)); // 위쪽 위주로 읽기
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, img.width, H/scale, 0, 0, W, H);
  const d = ctx.getImageData(0, 0, W, H), px = d.data;
  let sum = 0;
  for (let i = 0; i < px.length; i += 4){ const g = .299*px[i]+.587*px[i+1]+.114*px[i+2]; px[i]=px[i+1]=px[i+2]=g; sum += g; }
  const dark = sum/(px.length/4) < 110; // 다크 모드면 반전
  for (let i = 0; i < px.length; i += 4){
    let g = px[i]; if (dark) g = 255-g;
    if (thresh) g = g < 150 ? Math.max(0, g*0.6) : 255;
    px[i]=px[i+1]=px[i+2]=g;
  }
  ctx.putImageData(d, 0, 0);
  return cv;
}
// 여러 방식으로 읽어서 확실한 값이 나오면 멈춤
const OCR_PASSES = [ { w:450, th:false }, { w:600, th:false }, { w:350, th:false }, { w:800, th:true } ];
async function readUsage(img, onProgress){
  let best = null;
  for (let i = 0; i < OCR_PASSES.length; i++){
    const { w, th } = OCR_PASSES[i];
    const r = await Tesseract.recognize(prepImage(img, w, th), 'kor+eng', {
      logger: m => { if (m.status === 'recognizing text') onProgress((i + m.progress) / OCR_PASSES.length); }
    });
    const u = extractUsage(r.data.text);
    console.log('[phonefree] OCR pass', i + 1, JSON.stringify(u), r.data.text);
    if (best && best.total != null && u.total == null) u.total = best.total;
    if (u.daily != null && !u.unsure) return u;
    if (!best || (best.daily == null && u.daily != null)) best = u;
  }
  return { daily: null, total: best && best.total, unsure: true }; // 확실하지 않으면 제출 막음
}

/* ---------- 워터마크 사진 + 중복 확인용 해시 ---------- */
function watermarked(img, label){
  const W = Math.min(720, img.width), H = Math.round(img.height * W / img.width);
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const ctx = cv.getContext('2d');
  ctx.drawImage(img, 0, 0, W, H);
  // 사선 반복 글씨
  ctx.save();
  ctx.translate(W/2, H/2); ctx.rotate(-Math.PI/7);
  ctx.font = `700 ${Math.round(W/22)}px "Noto Sans KR", sans-serif`;
  ctx.fillStyle = 'rgba(200,30,30,0.16)'; ctx.textAlign = 'center';
  const step = Math.round(W/5.5), diag = Math.hypot(W, H);
  for (let y = -diag/2; y < diag/2; y += step) ctx.fillText(label, 0, y);
  ctx.restore();
  // 아래 띠
  const bh = Math.round(W/14);
  ctx.fillStyle = 'rgba(0,0,0,0.72)'; ctx.fillRect(0, H-bh, W, bh);
  ctx.fillStyle = '#fff'; ctx.font = `700 ${Math.round(bh*0.45)}px "Noto Sans KR", sans-serif`;
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText(label, W/2, H - bh/2);
  return cv.toDataURL('image/jpeg', 0.72);
}
async function fileHash(file){
  try {
    const buf = await crypto.subtle.digest('SHA-256', await file.arrayBuffer());
    return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2,'0')).join('').slice(0, 32);
  } catch { return ''; }
}
function nowLabel(){
  const d = new Date(), p = n => String(n).padStart(2,'0');
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

/* ---------- API ---------- */
function demoPhoto(label){
  const cv = document.createElement('canvas'); cv.width = 360; cv.height = 300;
  const x = cv.getContext('2d'); x.fillStyle = '#f2f2f7'; x.fillRect(0,0,360,300);
  x.fillStyle = '#8e8e93'; x.font = '18px sans-serif'; x.fillText('일일 평균 (데모 사진)', 20, 50);
  x.fillStyle = '#000'; x.font = '700 40px sans-serif'; x.fillText(label, 20, 105);
  x.fillStyle = '#3b82f6'; [60,140,40].forEach((h,i)=>x.fillRect(30+i*70, 250-h, 40, h));
  return cv.toDataURL('image/jpeg', .8);
}
const mock = (() => {
  const keys = {}; for (let c = 1; c <= 10; c++) keys[c] = 'DEMO' + c;
  let round = 1, open = true; const rows = [];
  for (let c = 1; c <= 10; c++) for (let n = 1; n <= 28; n++){
    if (Math.random() < .25) continue;
    const base = 180 + Math.random()*240 + c*6;
    for (let r = 1; r <= 5; r++){
      if (r > 1 && Math.random() < .25) continue;
      const f = 1 - (r-1)*(.04 + (c%4)*.02) + (Math.random()-.5)*.2;
      const min = Math.round(base*f);
      rows.push({ round:r, c, num:n, min, total: Math.round(min*(2+Math.random()*4)), device: Math.random()<.6?'아이폰':'안드로이드', method:'자동인식', time:new Date().toISOString(), hash:'h'+Math.random(), pid:'demo' });
    }
  }
  // 중복 의심 예시: 3반 5번과 7반 12번이 같은 사진
  const dupA = rows.find(r=>r.round===1&&r.c===3), dupB = rows.find(r=>r.round===1&&r.c===7);
  if (dupA && dupB){ dupB.min = dupA.min; dupB.total = dupA.total; dupB.hash = dupA.hash; }
  const photos = {};
  return async p => {
    await new Promise(r => setTimeout(r, 250));
    const chk = () => { const c = Number(p.c); if (!keys[c] || keys[c] !== p.k) throw new Error('입장 링크가 올바르지 않습니다.'); return c; };
    const adm = () => { if (p.key !== 'demo') throw new Error('관리자 비밀번호가 틀렸습니다. (데모: demo)'); };
    if (p.action === 'info'){ const c = chk(); return { ok:true, classNo:c, round, open, maxNumber:30, photoDays:30, submitted: rows.filter(r=>r.round===round&&r.c===c).map(r=>r.num) }; }
    if (p.action === 'submit'){ const c = chk(); const pid = 'p'+Date.now(); photos[pid] = p.photo; const i = rows.findIndex(r=>r.round===round&&r.c===c&&r.num===Number(p.num)); const row={round,c,num:Number(p.num),min:Number(p.min),total:p.total===''?null:Number(p.total),device:p.device==='ios'?'아이폰':'안드로이드',method:'자동인식',time:new Date().toISOString(),hash:p.hash,pid}; if(i>=0) rows[i]=row; else rows.push(row); return {ok:true, updated:i>=0}; }
    if (p.action === 'admin'){ adm(); return { ok:true, round, open, classCount:10, maxNumber:30, photoDays:30, keys, rows }; }
    if (p.action === 'photo'){ adm(); const r = rows.find(x=>x.pid===p.id); const url = photos[p.id] || demoPhoto(fmt(r?r.min:200)); return { ok:true, mime:'image/jpeg', data:url.split(',')[1] }; }
    if (p.action === 'reset'){ const before = rows.length; const keep = p.scope==='all' ? [] : rows.filter(r=>r.round!==Number(p.round)); rows.length = 0; rows.push(...keep); if (p.scope==='all') round = 1; return { ok:true, deleted: before-keep.length }; }
    if (p.action === 'setRound'){ adm(); if (p.round) round = Number(p.round); if (p.open) open = p.open === 'true'; return { ok:true }; }
    throw new Error('알 수 없는 요청');
  };
})();
const NET_ERR = e => new Error('서버에 연결하지 못했어요. 와이파이를 끄고 데이터로 접속하거나, 다른 브라우저(크롬 시크릿 창 등)로 다시 열어 주세요. (오류: ' + (e && e.message || e) + ')');
// 'c'는 구글 Apps Script가 내부적으로 쓰는 예약 파라미터라 'cls'로 바꿔 보냄
const toServer = p => { const q = { ...p }; if ('c' in q){ q.cls = q.c; delete q.c; } return q; };
async function api(p){
  let res;
  if (DEMO) res = await mock(p);
  else {
    try {
      const r = await fetch(CONFIG.API_URL + '?' + new URLSearchParams(toServer(p)).toString());
      res = JSON.parse(await r.text());
    } catch (e) { console.error('[phonefree] API 연결 실패', e); throw NET_ERR(e); }
  }
  if (!res.ok) throw new Error(res.error || '오류가 발생했습니다.');
  return res;
}
// 사진이 들어가는 제출은 POST (text/plain 이라 추가 확인 요청 없이 전송됨)
async function apiPost(p){
  let res;
  if (DEMO) res = await mock(p);
  else {
    try {
      const r = await fetch(CONFIG.API_URL, { method:'POST', headers:{ 'Content-Type':'text/plain;charset=utf-8' }, body: JSON.stringify(toServer(p)) });
      res = JSON.parse(await r.text());
    } catch (e) { console.error('[phonefree] API 연결 실패', e); throw NET_ERR(e); }
  }
  if (!res.ok) throw new Error(res.error || '오류가 발생했습니다.');
  return res;
}

/* ================== 학생 화면 ================== */
const S = { classNo:null, key:null, round:1, open:true, maxNumber:30, photoDays:30, submitted:[], num:null, device:null,
  img:null, file:null, daily:null, total:null, status:'idle' };

async function studentInit(){

/* ================== 관리자 화면 ================== */
const A = { key:null, data:null, base:1, cmp:2, hl:null, chkC:1, chkR:null };

/* ---------- 중복 의심: 같은 사진 파일 또는 일일 평균·총 시간이 모두 같은 제출 ---------- */
function dupFlags(D){
  const flags = {}, by = {};
  const add = (k, r) => (by[k] = by[k] || []).push(r);
  D.rows.forEach(r => {
    if (r.hash) add(`h|${r.round}|${r.hash}`, r);
    if (r.total != null) add(`v|${r.round}|${r.min}|${r.total}`, r);
  });
  Object.entries(by).forEach(([k, list]) => {
    if (list.length < 2) return;
    const why = k[0] === 'h' ? '같은 사진 파일' : '시간 수치 동일';
    list.forEach(r => {
      const others = list.filter(o => o !== r).map(o => `${o.c}반 ${o.num}번`).join(', ');
      const key = `${r.round}|${r.c}|${r.num}`;
      flags[key] = flags[key] ? flags[key] : `${why}: ${others}`;
    });
  });
  return flags;
}

    <div class="tablewrap" style="margin-top:8px"><table>
      <thead><tr><th>번호</th><th>일일 평균</th><th>총 스크린 타임</th><th>기기</th><th>제출 시각</th><th>확인</th><th>사진</th></tr></thead>

function avg(a){ return a.length ? a.reduce((s,x)=>s+x,0)/a.length : null; }
const hm = m => { if (m == null) return '-'; m = Math.round(m); return `${Math.floor(m/60)}:${String(m%60).padStart(2,'0')}`; };

/* ---------- 회차별 추이 ---------- */
function trendHTML(D){
  const rs = [...new Set(D.rows.map(r=>r.round))].sort((a,b)=>a-b);
  if (rs.length < 2) return `<div class="card"><h2>회차별 추이</h2><p class="sub">2회차 이상 기록이 쌓이면 반별 추이가 여기에 나와요.</p></div>`;
  const A_ = (c, r) => avg(D.rows.filter(x => (c==null || x.c===c) && x.round===r).map(x=>x.min));
  const N_ = (c, r) => D.rows.filter(x => (c==null || x.c===c) && x.round===r).length;
  const classes = Array.from({length:D.classCount}, (_,i)=>i+1);
  const grid = classes.map(c => rs.map(r => A_(c,r)));
  const gradeLine = rs.map(r => A_(null,r));
  const vals = grid.flat().filter(v=>v!=null);
  const lo = Math.min(...vals), hi = Math.max(...vals);
  const shade = v => { if (v==null) return ''; const t = hi>lo ? (v-lo)/(hi-lo) : .5; return `background:rgba(${Math.round(31+150*t)},${Math.round(122-40*t)},${Math.round(83-50*t)},${.10+.22*t})`; };
  const chg = (a,b) => (a && b!=null) ? (b-a)/a*100 : null;
  const pct = v => v==null ? '-' : (v>0?'+':'')+v.toFixed(1)+'%';
  const arrow = (prev, v) => (prev==null||v==null) ? '' : v<prev ? '<small class="down"> ▼</small>' : v>prev ? '<small class="up"> ▲</small>' : '';

  // 꺾은선 그래프
  const W=760, H=260, L=64, R=36, T=22, B=34;
  const yMax = Math.ceil(Math.max(...vals, ...gradeLine.filter(v=>v!=null))/60)*60 || 60;
  const x = i => rs.length===1 ? L+(W-L-R)/2 : L + i*(W-L-R)/(rs.length-1);
  const y = v => T + (H-T-B)*(1 - v/yMax);
  const path = arr => arr.map((v,i)=> v==null ? null : `${x(i)},${y(v)}`).filter(Boolean).join(' ');
  let gridLines = '';
  for (let h = 0; h <= yMax; h += 60) gridLines += `<line x1="${L}" x2="${W-R}" y1="${y(h)}" y2="${y(h)}" stroke="#e6eae7"/><text x="${L-8}" y="${y(h)+4}" text-anchor="end" font-size="11" fill="#5d6862">${h/60}시간</text>`;
  const xLabels = rs.map((r,i)=>`<text x="${x(i)}" y="${H-10}" text-anchor="middle" font-size="12" fill="#5d6862">${r}회차</text>`).join('');
  const hl = A.hl;
  const classLines = classes.map((c,ci)=> c===hl ? '' : `<polyline points="${path(grid[ci])}" fill="none" stroke="#c9d3ce" stroke-width="1.5"/>`).join('');
  const hlLine = hl ? `<polyline points="${path(grid[hl-1])}" fill="none" stroke="#b4541f" stroke-width="3"/>` + grid[hl-1].map((v,i)=> v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="4" fill="#b4541f"/>`).join('') : '';
  const gLine = `<polyline points="${path(gradeLine)}" fill="none" stroke="#1f7a53" stroke-width="3.5"/>` + gradeLine.map((v,i)=> v==null?'':`<circle cx="${x(i)}" cy="${y(v)}" r="4.5" fill="#1f7a53"/><text x="${x(i)}" y="${y(v)-10}" text-anchor="middle" font-size="11.5" font-weight="700" fill="#1f7a53">${hm(v)}</text>`).join('');

  const first = rs[0], last = rs[rs.length-1];
  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h2 style="margin:0">회차별 추이</h2>
      <div class="row"><span class="sub">강조할 반</span><select id="hl"><option value="">없음</option>${classes.map(c=>`<option value="${c}" ${c===hl?'selected':''}>${c}반</option>`).join('')}</select></div>
    </div>
    <svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto;display:block">${gridLines}${xLabels}${classLines}${hlLine}${gLine}</svg>
    <p class="note"><b style="color:#1f7a53">━ 학년 평균</b> &nbsp; <span style="color:#9aa6a0">━ 각 반</span>${hl?` &nbsp; <b style="color:#b4541f">━ ${hl}반</b>`:''}</p>
    <div class="tablewrap" style="margin-top:8px"><table>
      <thead><tr><th>반</th>${rs.map(r=>`<th>${r}회차</th>`).join('')}<th>${first}→${last}회차</th></tr></thead>
      <tbody>
        ${classes.map((c,ci)=>`<tr ${c===hl?'style="outline:2px solid #b4541f;outline-offset:-2px"':''}><td><b>${c}반</b></td>${grid[ci].map((v,i)=>`<td style="${shade(v)}">${hm(v)}${arrow(i?grid[ci][i-1]:null, v)}<br><small class="sub">${N_(c,rs[i])}명</small></td>`).join('')}<td class="${(chg(grid[ci][0],grid[ci][rs.length-1])??0)<0?'down':'up'}">${pct(chg(grid[ci][0],grid[ci][rs.length-1]))}</td></tr>`).join('')}
        <tr style="border-top:2px solid var(--ink)"><td><b>학년</b></td>${gradeLine.map((v,i)=>`<td><b>${hm(v)}</b>${arrow(i?gradeLine[i-1]:null, v)}<br><small class="sub">${N_(null,rs[i])}명</small></td>`).join('')}<td class="${(chg(gradeLine[0],gradeLine[rs.length-1])??0)<0?'down':'up'}"><b>${pct(chg(gradeLine[0],gradeLine[rs.length-1]))}</b></td></tr>
      </tbody>
    </table></div>
    <p class="note">시간은 <b>시:분</b> 형식이에요. ▼는 직전 회차보다 줄어든 것, ▲는 늘어난 것이에요. 칸 색이 진할수록 사용 시간이 길어요.</p>
  </div>`;
}

function renderAdmin(){
  const D = A.data; app.className = 'wrap wide';
  const rounds = [...new Set([...D.rows.map(r=>r.round), D.round])].sort((a,b)=>a-b);
  const cur = D.rows.filter(r => r.round === D.round);
  const base = location.origin + location.pathname;
  const per = [];
  for (let c = 1; c <= D.classCount; c++){
    const a = D.rows.filter(r => r.c===c && r.round===A.base).map(r=>r.min);
    const b = D.rows.filter(r => r.c===c && r.round===A.cmp).map(r=>r.min);
    const n = cur.filter(r => r.c===c).length;
    const ma = avg(a), mb = avg(b);
    per.push({ c, n, ma, mb, na:a.length, nb:b.length, chg: (ma && mb!=null && A.base!==A.cmp) ? (mb-ma)/ma*100 : null });
  }
  const maxAvg = Math.max(1, ...per.map(p => Math.max(p.ma||0, p.mb||0)));
  const ranked = per.filter(p=>p.chg!=null).sort((x,y)=>x.chg-y.chg);
  const rank = Object.fromEntries(ranked.map((p,i)=>[p.c, i+1]));
  const allA = avg(D.rows.filter(r=>r.round===A.base).map(r=>r.min));
  const allB = avg(D.rows.filter(r=>r.round===A.cmp).map(r=>r.min));
  const opt = (v, sel) => rounds.concat(rounds.includes(v)?[]:[]).map(r=>`<option value="${r}" ${r===sel?'selected':''}>${r}회차</option>`).join('');

  app.innerHTML = `${DEMO?'<div class="demo noprint">데모 모드: 무작위 예시 데이터예요.</div>':''}
  <div class="noprint">
    <div class="row" style="justify-content:space-between">
      <div><span class="badge">관리자</span><h1>${esc(CONFIG.TITLE)} · ${esc(CONFIG.GRADE)}</h1></div>
      <div class="row"><button class="btn sm ghost" id="reload">새로고침</button><button class="btn sm ghost" id="csv">CSV 받기</button></div>
    </div>

    <div class="card">
      <h2>제출 설정</h2>
      <div class="row">
        <span class="sub">현재 회차</span>
        <select id="round">${[...rounds, rounds[rounds.length-1]+1].map(r=>`<option value="${r}" ${r===D.round?'selected':''}>${r}회차${r>Math.max(...rounds)?' (새로 시작)':''}</option>`).join('')}</select>
        <span class="badge ${D.open?'':'warn'}">${D.open?'제출 받는 중':'제출 마감'}</span>
        <button class="btn sm ${D.open?'ghost':''}" id="toggle">${D.open?'제출 마감하기':'제출 열기'}</button>
      </div>
      <p class="note">회차를 바꾸면 학생 제출이 새 회차로 저장돼요. (예: 1회차 = 폰프리 전, 2회차 = 폰프리 후)</p>
    </div>

    <div class="stats" style="margin-top:14px">
      <div class="stat"><small>${D.round}회차 제출 인원</small><div>${cur.length}명</div></div>
      <div class="stat"><small>${A.base}회차 학년 평균</small><div>${fmt(allA)}</div></div>
      <div class="stat"><small>${A.cmp}회차 학년 평균</small><div>${fmt(allB)}</div></div>
      <div class="stat"><small>변화</small><div class="${allA&&allB!=null&&allB<allA?'down':'up'}">${allA&&allB!=null&&A.base!==A.cmp?((allB-allA)/allA*100).toFixed(1)+'%':'-'}</div></div>
    </div>

    <div class="card">
      <div class="row" style="justify-content:space-between;margin-bottom:8px">
        <h2 style="margin:0">반별 비교</h2>
        <div class="row"><select id="base">${opt(A.base,A.base)}</select><span class="sub">→</span><select id="cmp">${opt(A.cmp,A.cmp)}</select></div>
      </div>
      <div class="tablewrap"><table>
        <thead><tr><th>반</th><th>${D.round}회차 제출</th><th class="l" style="width:34%">평균 (연한색 ${A.base}회차 / 진한색 ${A.cmp}회차)</th><th>${A.base}회차</th><th>${A.cmp}회차</th><th>변화율</th><th>감소 순위</th></tr></thead>
        <tbody>${per.map(p=>`<tr>
          <td><b>${p.c}반</b></td><td>${p.n}명</td>
          <td class="l"><div class="bar b" style="width:${(p.ma||0)/maxAvg*100}%"></div><div class="bar" style="width:${(p.mb||0)/maxAvg*100}%;margin-top:4px"></div></td>
          <td>${fmt(p.ma)}<br><small class="sub">${p.na}명</small></td><td>${fmt(p.mb)}<br><small class="sub">${p.nb}명</small></td>
          <td class="${p.chg==null?'':p.chg<0?'down':'up'}">${p.chg==null?'-':(p.chg>0?'+':'')+p.chg.toFixed(1)+'%'}</td>
          <td>${rank[p.c]?rank[p.c]+'위':'-'}</td></tr>`).join('')}</tbody>
      </table></div>
      <p class="note">평균은 제출한 학생 기준이에요. 회차별 제출 인원이 크게 다르면 비교에 주의하세요.</p>
    </div>

    ${trendHTML(D)}

    ${checkHTML(D)}

    <div class="card links">
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><h2 style="margin:0">반별 입장 링크</h2><button class="btn sm" id="printqr">QR 인쇄</button></div>
      <div class="tablewrap"><table><tbody>${Object.entries(D.keys).map(([c,k])=>{ const u = `${base}?c=${c}&k=${k}`; return `<tr><td><b>${c}반</b></td><td class="l"><code>${esc(u)}</code></td><td><button class="btn sm ghost" data-copy="${esc(u)}">복사</button></td></tr>`; }).join('')}</tbody></table></div>
      <p class="note">링크마다 반 입장키가 들어 있어요. 반장에게 자기 반 링크만 전달해 주세요.</p>
    </div>

    <div class="card">
      <h2>기록 초기화</h2>
      <div class="row">
        <select id="rsScope">
          ${rounds.map(r=>`<option value="round:${r}">${r}회차 기록만 지우기 (${D.rows.filter(x=>x.round===r).length}건)</option>`).join('')}
          <option value="all">전체 기록 지우기 (${D.rows.length}건, 1회차로 돌아감)</option>
        </select>
        <button class="btn sm" id="rsGo" style="background:var(--warn)">초기화</button>
      </div>
      <p class="note">지운 기록은 되돌릴 수 없어요. 필요하면 먼저 <b>CSV 받기</b>로 백업하세요. 지운 기록의 사진도 함께 휴지통으로 옮겨져요. 반별 입장 링크는 바뀌지 않아요.</p>
    </div>
  </div>
  <div id="qrarea" class="hidden"><h1 class="center">${esc(CONFIG.TITLE)}</h1><p class="sub center">${esc(CONFIG.METRIC)}</p><div class="qrgrid" id="qrgrid"></div>
    <button class="btn noprint" id="qrback">돌아가기</button></div>`;

  $('#reload').onclick = adminLoad;
  $('#base').onchange = e => { A.base = Number(e.target.value); renderAdmin(); };
  $('#cmp').onchange = e => { A.cmp = Number(e.target.value); renderAdmin(); };
  $('#round').onchange = async e => { if (!confirmRound(Number(e.target.value))) { e.target.value = D.round; return; } await api({ action:'setRound', key:A.key, round:e.target.value }); adminLoad(); };
  $('#toggle').onclick = async () => { await api({ action:'setRound', key:A.key, open: String(!D.open) }); adminLoad(); };
  app.querySelectorAll('[data-copy]').forEach(b => b.onclick = async () => { try { await navigator.clipboard.writeText(b.dataset.copy); b.textContent = '복사됨'; } catch { prompt('복사하세요', b.dataset.copy); } });
  $('#csv').onclick = () => downloadCSV(D);
  const hlSel = $('#hl'); if (hlSel) hlSel.onchange = e => { A.hl = Number(e.target.value) || null; renderAdmin(); };
  $('#chkR').onchange = e => { A.chkR = Number(e.target.value); renderAdmin(); };
  $('#chkC').onchange = e => { A.chkC = Number(e.target.value); renderAdmin(); };
  app.querySelectorAll('[data-photo]').forEach(b => b.onclick = () => showPhoto(b.dataset.photo, b.dataset.label));
  $('#rsGo').onclick = async () => {
    const v = $('#rsScope').value, all = v === 'all', r = all ? null : Number(v.split(':')[1]);
    const label = all ? '전체 기록' : `${r}회차 기록`;
    const typed = window.prompt(`${label}을 지웁니다. 되돌릴 수 없어요.\n계속하려면 '초기화'라고 입력하세요.`);
    if (typed !== '초기화') return;
    try {
      const res = await api(all ? { action:'reset', key:A.key, scope:'all' } : { action:'reset', key:A.key, scope:'round', round:r });
      alert(`${res.deleted}건을 지웠어요.`);
      adminLoad();
    } catch(e){ alert(e.message); }
  };
  $('#printqr').onclick = () => {
    const g = $('#qrgrid'); g.innerHTML = '';
    Object.entries(D.keys).forEach(([c,k]) => {
      const box = document.createElement('div'); box.className = 'qrbox';
      box.innerHTML = `<b>${esc(CONFIG.GRADE)} ${c}반</b><div class="q"></div><small class="sub">우리 반 전용 · 다른 반 공유 금지</small>`;
      g.appendChild(box);
      new QRCode(box.querySelector('.q'), { text:`${base}?c=${c}&k=${k}`, width:150, height:150 });
    });
    app.querySelector('.noprint').classList.add('hidden'); $('#qrarea').classList.remove('hidden');
    setTimeout(() => window.print(), 300);
  };
  $('#qrback').onclick = () => renderAdmin();
}
function confirmRound(r){ return window.confirm(`현재 회차를 ${r}회차로 바꿀까요? 이후 학생 제출은 ${r}회차로 저장돼요.`); }

function downloadCSV(D){
  const flags = dupFlags(D);
  const lines = [['회차','반','번호','일일평균(분)','총스크린타임(분)','기기','제출시각','중복의심']].concat(
    D.rows.slice().sort((a,b)=>a.round-b.round||a.c-b.c||a.num-b.num).map(r=>[r.round,r.c,r.num,r.min,r.total??'',r.device,r.time||'',`"${(flags[`${r.round}|${r.c}|${r.num}`]||'').replace(/"/g,'""')}"`]));
  const blob = new Blob(['﻿' + lines.map(l=>l.join(',')).join('\n')], { type:'text/csv;charset=utf-8' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = '폰프리_사용량.csv'; a.click();
}

/* ---------- 시작 ---------- */
if (params.has('admin')) adminLogin(); else studentInit();
</script>
</body>
</html>
